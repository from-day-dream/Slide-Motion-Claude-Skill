<!doctype html>
<html><head><meta charset="utf-8">
<style>
{{FONT_FACES}}
{{TOKENS}}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;color:var(--brand-ink)}
.dots-paper{background-color:var(--brand-paper);background-image:radial-gradient(circle,var(--brand-dot) 1.5px,transparent 2px);background-size:48px 48px;background-position:24px 24px}
.dots-fog{background-color:var(--brand-fog);background-image:radial-gradient(circle,var(--brand-dot-fog) 1.5px,transparent 2px);background-size:48px 48px;background-position:24px 24px}
.dots-ink{background-color:var(--brand-ink);background-image:radial-gradient(circle,var(--brand-dot-ink) 1.5px,transparent 2px);background-size:48px 48px;background-position:24px 24px}
.corner{position:absolute;font-family:var(--brand-font-body);font-weight:500;font-size:var(--brand-size-meta);letter-spacing:.08em;line-height:1.2;text-transform:uppercase}
.tl{top:72px;left:80px}.tr{top:72px;right:80px;text-align:right}.bl{bottom:72px;left:80px}.br{bottom:72px;right:80px;text-align:right}
.mark{display:flex;gap:12px;align-items:center}.mark svg{width:28px;height:28px;flex:none}
/* scribbled word: hand-drawn blue ellipse around the emphasis word */
.scrib{position:relative;display:inline-block;margin:0 .1em}
.scrib em{position:relative;z-index:1;font-family:var(--brand-font-accent);font-style:italic;font-weight:400;letter-spacing:-.01em}
.scrib svg{position:absolute;z-index:0;left:-17%;top:-20%;width:134%;height:140%;overflow:visible;pointer-events:none;color:var(--brand-blue)}
/* rounded image, no frame */
.rimg{position:absolute;border-radius:36px;overflow:hidden}
.rimg img{display:block;width:100%;height:100%;object-fit:cover}
/* folder */
.folder{position:absolute;width:190px;height:150px}
.folder .tab{position:absolute;left:0;top:0;width:84px;height:34px;border-radius:12px 12px 0 0;background:var(--brand-blue-soft)}
.folder .back{position:absolute;left:0;right:0;top:20px;bottom:0;border-radius:12px;background:var(--brand-blue-soft)}
.folder .sheet{position:absolute;left:12px;right:12px;top:30px;height:40px;border-radius:6px;background:var(--brand-haze)}
.folder .front{position:absolute;left:0;right:0;top:46px;bottom:0;border-radius:12px;background:linear-gradient(180deg,var(--brand-aqua),var(--brand-blue-soft))}
/* collaborator cursor */
.collab{position:absolute;display:flex;align-items:flex-start}
.collab svg{width:34px;height:34px;flex:none}
.collab span{margin:24px 0 0 -4px;padding:8px 16px;font-family:var(--brand-font-body);font-weight:500;font-size:var(--brand-size-meta);letter-spacing:.08em;text-transform:uppercase;line-height:1.2}
.t-blue span{background:var(--brand-blue);color:var(--brand-paper)}.t-blue svg{color:var(--brand-blue)}
.t-ink span{background:var(--brand-ink);color:var(--brand-paper)}.t-ink svg{color:var(--brand-ink)}
.t-coral span{background:var(--brand-coral);color:var(--brand-ink)}.t-coral svg{color:var(--brand-coral)}
/* pills */
.pill{display:inline-flex;align-items:center;padding:14px 34px;border-radius:999px;background:var(--brand-blue);color:var(--brand-paper);font-family:var(--brand-font-body);font-weight:400;font-size:32px;line-height:1}

.upto{position:absolute;top:150px;left:88px;margin:0;font-family:var(--brand-font-body);font-weight:500;font-size:var(--brand-size-meta);letter-spacing:.08em;text-transform:uppercase;color:var(--brand-blue)}
.big{position:absolute;top:170px;left:56px;font-family:var(--brand-font-heading);font-weight:700;font-size:500px;line-height:1;letter-spacing:-.08em;color:var(--brand-blue)}
h2{position:absolute;top:690px;left:80px;width:920px;margin:0;text-wrap:balance;font-family:var(--brand-font-heading);font-weight:700;font-size:88px;line-height:1.08;letter-spacing:-.065em}
.cards{position:absolute;left:80px;right:80px;top:930px;display:flex;gap:20px}
.card{flex:1;display:flex;flex-direction:column;gap:10px;padding:26px 28px;border-radius:24px;background:var(--brand-fog)}
.card.farm{background:var(--brand-ink);color:var(--brand-paper)}
.card .l{font-family:var(--brand-font-body);font-weight:500;font-size:var(--brand-size-meta);letter-spacing:.08em;text-transform:uppercase}
.card .v{font-family:var(--brand-font-heading);font-weight:700;font-size:56px;line-height:1;letter-spacing:-.04em}
.note{position:absolute;left:80px;bottom:72px;margin:0;font-family:var(--brand-font-body);font-weight:500;font-size:var(--brand-size-meta);letter-spacing:.08em;text-transform:uppercase;color:var(--brand-mist)}

</style></head>
<body>
<div class="slide dots-paper" data-slide="3">
  <p class="upto" data-text="meta">Up to</p>
  <div class="big" aria-hidden="true">17×</div>
  <div class="collab t-ink" style="left:720px;top:520px"><svg viewBox="0 0 34 34" aria-hidden="true"><path d="M2 2 L32 13 L18 17 L13 32 Z" fill="currentColor"/></svg><span data-text="meta">120 frames · 4K</span></div>
  <h2 data-text="headline"><span class="scrib"><svg viewBox="0 0 200 100" preserveAspectRatio="none" aria-hidden="true"><path d="M40 74 C 8 60, 18 20, 100 12 C 168 6, 204 30, 192 58 C 180 86, 104 94, 54 86 C 14 79, 2 56, 24 36 C 48 16, 126 8, 172 24 C 196 33, 194 52, 178 64" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg><em>cheaper</em></span> than a traditional render farm.</h2>
  <div class="cards">
    <div class="card"><span class="l" data-text="meta">Standard</span><span class="v" data-text="clarifier">$0.096</span></div>
    <div class="card"><span class="l" data-text="meta">Secure</span><span class="v" data-text="clarifier">$0.216</span></div>
    <div class="card farm"><span class="l" data-text="meta">Render farm</span><span class="v" data-text="clarifier">$1.66</span></div>
  </div>
  <p class="note" data-text="meta">Avg of 5 runs · Cycles 1024 samples</p>
  <div class="corner br" data-text="meta">[ 003 ]</div>
</div>
</body></html>
