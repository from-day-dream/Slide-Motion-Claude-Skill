<!doctype html>
<!-- ARCHETYPE band-field · register: expressive · references/layouts.md §3
     STRUCTURE ONLY. Colours, faces and curves are role placeholders and window.__motion tokens, bound
     to the brand when rendered. Placeholder copy. 9:16. -->
<html><head><meta charset="utf-8">
<style>
{{FONT_FACES}}
{{TOKENS}}
.scene{position:relative;width:1080px;height:1920px;overflow:hidden;background:BRAND_BACKGROUND;color:BRAND_TEXT}
/* Bands: one shared angle, edge to edge, 12-25% of the long side thick. */
.field{position:absolute;left:50%;top:50%;width:0;height:0;transform:rotate(-30deg)}
.band{position:absolute;left:-1500px;width:3000px;height:340px;transform-origin:0 50%}
.b1{top:-1180px;background:BRAND_COLOR_1}.b2{top:-780px;background:BRAND_ACCENT}.b3{top:-380px;background:BRAND_COLOR_2}
.b4{top:20px;background:BRAND_COLOR_3}.b5{top:420px;background:BRAND_ACCENT}.b6{top:820px;background:BRAND_COLOR_4}
.band-top{position:absolute;left:72px;right:72px;top:240px;display:flex;justify-content:space-between;font-family:BRAND_FONT_BODY;font-size:var(--brand-size-meta)}
.band-top span{background:BRAND_BACKGROUND;padding:6px 12px;border-radius:6px}
/* Chunky stacked type, one word per line, each line on its own block; extrude in the accent. */
.stack{position:absolute;left:72px;top:520px;margin:0;font-family:BRAND_FONT_DISPLAY;font-weight:BRAND_WEIGHT_DISPLAY;font-size:230px;line-height:.86;letter-spacing:-.04em;text-transform:uppercase;color:BRAND_BACKGROUND}
.stack span{display:inline-block;background:BRAND_TEXT;padding:6px 28px 18px;margin-bottom:24px;
  box-shadow:10px 10px 0 BRAND_ACCENT,20px 20px 0 BRAND_DARK}
</style></head>
<body>
<div class="scene" data-scene="1">
  <div class="field" aria-hidden="true"><div class="band b1"></div><div class="band b2"></div><div class="band b3"></div><div class="band b4"></div><div class="band b5"></div><div class="band b6"></div></div>
  <div class="band-top"><span data-text="meta">@handle</span><span data-text="meta">Drop 04</span></div>
  <h2 class="stack" data-text="headline"><span>Loud</span><br><span>and</span><br><span>clear</span></h2>
</div>
<script>
const M = window.__motion, D = M.duration, E = M.ease;
const tl = gsap.timeline({ paused: true });
const LENGTH = 3;

// Bands wipe in one after another along their own axis, all from the same side.
tl.from('.band', { scaleX: 0, duration: D.move, ease: E.move, stagger: D.stagger * 2 }, 0)
// Idle: the whole field slides slowly along the band axis.
  .fromTo('.field', { x: 0, y: 0 }, { x: -60, y: 35, duration: LENGTH, ease: E.ambient }, 0);

// Type stacks in line by line; the extrude grows out of each block as it lands.
tl.from('.stack span', { yPercent: 80, opacity: 0, duration: D.enter, ease: E.enter, stagger: D.stagger * 3 }, 0.35)
  .from('.stack span', { boxShadow: '0px 0px 0 transparent, 0px 0px 0 transparent', duration: D.enter, ease: E.enter, stagger: D.stagger * 3 }, 0.45)
  .from('.band-top', { opacity: 0, duration: D.enter, ease: E.fade }, 0)
  .addLabel('hold', 0.45 + D.stagger * 6 + D.enter);

tl.addLabel('end', LENGTH);
window.__scene = { tl };
</script>
</body></html>
