<!doctype html>
<!-- ARCHETYPE card-deck · register: both · references/layouts.md §8
     STRUCTURE ONLY. Colours, faces and curves are role placeholders and window.__motion tokens, bound
     to the brand when rendered. Placeholder copy; shapes stand in for images. 9:16. -->
<html><head><meta charset="utf-8">
<style>
{{FONT_FACES}}
{{TOKENS}}
.scene{position:relative;width:1080px;height:1920px;overflow:hidden;background:BRAND_SURFACE;color:BRAND_TEXT}
.band-top{position:absolute;left:72px;right:72px;top:240px;display:flex;justify-content:space-between;font-family:BRAND_FONT_BODY;font-size:var(--brand-size-meta)}
/* A perspective stack: the front card upright and readable, the back cards stepped up and darkened. */
.deck{position:absolute;left:72px;top:560px;width:936px;height:1300px;perspective:2400px}
.card{position:absolute;inset:0;border-radius:40px;background:BRAND_BACKGROUND;box-shadow:0 24px 60px rgba(0,0,0,.14);overflow:hidden}
.card .shade{position:absolute;inset:0;background:BRAND_DARK;opacity:0}
.card .pic{position:absolute;left:40px;right:40px;top:450px;bottom:40px;border-radius:24px}
.k1 .pic{background:BRAND_COLOR_1}.k2 .pic{background:BRAND_COLOR_2}.k3 .pic{background:BRAND_ACCENT}.k4 .pic{background:BRAND_COLOR_3}.k5 .pic{background:BRAND_COLOR_4}
.card h2{position:absolute;left:48px;right:48px;top:90px;margin:0;font-family:BRAND_FONT_DISPLAY;font-weight:BRAND_WEIGHT_DISPLAY;font-size:300px;line-height:.9;letter-spacing:-.05em}
.card p{position:absolute;left:56px;top:370px;margin:0;font-family:BRAND_FONT_BODY;font-size:var(--brand-size-support)}
.count{position:absolute;right:72px;top:1460px;font-family:BRAND_FONT_BODY;font-size:var(--brand-size-meta)}
</style></head>
<body>
<div class="scene" data-scene="1">
  <div class="band-top"><span data-text="meta">@handle</span><span data-text="meta">Five findings</span></div>
  <div class="deck">
    <div class="card k5" aria-hidden="true"><div class="pic"></div><div class="shade"></div></div>
    <div class="card k4" aria-hidden="true"><div class="pic"></div><div class="shade"></div></div>
    <div class="card k3"><h2 data-text="headline">3×</h2><p data-text="support">faster first drafts</p><div class="pic" data-visual></div><div class="shade"></div></div>
    <div class="card k2" aria-hidden="true"><h2>2</h2><div class="pic"></div><div class="shade"></div></div>
    <div class="card k1" aria-hidden="true"><h2>1</h2><div class="pic"></div><div class="shade"></div></div>
  </div>
</div>
<script>
const M = window.__motion, D = M.duration, E = M.ease;
const tl = gsap.timeline({ paused: true });
const LENGTH = 3;
const SETTLE = motionKit.spring({ stiffness: 220, damping: 16 }); // the stack advances with a spring (motion-craft.md)

// Stack positions: index 0 is the front. Each step back: up, smaller, darker.
const place = n => ({ y: -n * 90, scale: 1 - n * 0.07, rotationX: n * 3 });
const cards = gsap.utils.toArray('.card').reverse(); // front first
cards.forEach((c, n) => { tl.set(c, place(n), 0); tl.set(c.querySelector('.shade'), { opacity: Math.min(0.45, n * 0.12) }, 0); });

// The deck rises in; then the two front cards flick off in alternating directions, with blur,
// and the stack advances to the next card each time.
tl.from('.deck', { yPercent: 40, opacity: 0, duration: D.move, ease: E.enter }, 0);
const flick = (k, dir, at) => {
  tl.to(cards[k], { x: dir * 1300, y: -200, rotation: dir * 28, filter: 'blur(6px)', duration: D.exit * 1.6, ease: E.exit }, at);
  cards.slice(k + 1).forEach((c, n) => {
    tl.to(c, { ...place(n), duration: D.enter * 1.3, ease: SETTLE }, at + D.exit * 0.6)
      .to(c.querySelector('.shade'), { opacity: Math.min(0.45, n * 0.12), duration: D.enter, ease: E.fade }, at + D.exit * 0.6);
  });
};
flick(0, 1, 0.55);
flick(1, -1, 0.95);
tl.addLabel('hold', 0.95 + D.exit * 0.6 + D.enter * 1.3);

// Idle: the cards behind breathe; the front card holds its text still.
tl.to(cards.slice(3), { y: '-=14', duration: LENGTH - 1.2, ease: E.ambient, stagger: 0.1 }, 1.2);

tl.addLabel('end', LENGTH);
window.__scene = { tl };
</script>
</body></html>
